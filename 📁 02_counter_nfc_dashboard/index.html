<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="JibAuto Systems opens a restaurant's Google review from one NFC tap.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="jibauto.net">
  <meta property="og:title" content="JibAuto Systems">
  <meta property="og:description" content="One NFC tap opens the Google review for the restaurant on the counter.">
  <meta property="og:url" content="https://jibauto.net">
  <link rel="canonical" href="https://jibauto.net">
  <title>JibAuto Systems</title>
  <style>
    :root {
      color-scheme: dark;
      --background-color: #07080b;
      --background-accent-color: #2a2418;
      --card-color: #12151a;
      --border-color: #2a3038;
      --text-color: #f7f3ea;
      --muted-text-color: #b7b0a4;
      --accent-color: #f0d48a;
      --accent-ink-color: #16130d;
      --button-gradient-start: #f0d48a;
      --button-gradient-end: #e7c56e;
      --button-shadow-color: #f0d48a47;
      --overlay-color: #07080be0;
      --telemetry-color: #0d1015;
      --keypad-color: #1c2128;
      --heading-font-weight: 700;
      --button-font-weight: 800;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 50% 0%, var(--background-accent-color) 0%, transparent 58%),
        var(--background-color);
      color: var(--text-color);
    }
    .card {
      width: min(420px, 100%);
      padding: 32px 22px 28px;
      border-radius: 28px;
      border: 1px solid var(--border-color);
      background: var(--card-color);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent-color);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    h1 {
      margin: 14px 0 10px;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.7rem, 6.5vw, 2.15rem);
      font-weight: var(--heading-font-weight);
      line-height: 1.15;
    }
    .address,
    .support {
      margin: 0;
      color: var(--muted-text-color);
      line-height: 1.45;
    }
    .address { margin-bottom: 8px; }
    .support { margin-bottom: 28px; }
    .review {
      width: 100%;
      min-height: 84px;
      padding: 18px 16px;
      border: 0;
      border-radius: 20px;
      background-color: var(--accent-color);
      background-image: linear-gradient(180deg, var(--button-gradient-start) 0%, var(--button-gradient-end) 100%);
      color: var(--accent-ink-color);
      font: inherit;
      font-size: 1.12rem;
      font-weight: var(--button-font-weight);
      line-height: 1.25;
      cursor: pointer;
      box-shadow: 0 12px 28px var(--button-shadow-color);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .review:hover {
      background-image: linear-gradient(180deg, var(--button-gradient-end) 0%, var(--button-gradient-start) 100%);
    }
    .review:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .review:disabled {
      cursor: progress;
      animation: none;
    }
    .review[hidden],
    .stamp[hidden],
    .telemetry[hidden] { display: none; }
    .telemetry {
      margin: 0 0 18px;
      padding: 14px 14px 12px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      background: var(--telemetry-color);
    }
    .telemetry-label,
    .stamp-label {
      margin: 0;
      color: var(--muted-text-color);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .telemetry-count {
      margin: 4px 0 8px;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 2.4rem;
      font-weight: var(--heading-font-weight);
      line-height: 1;
    }
    .stamps {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .stamps i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--accent-color);
      background: transparent;
    }
    .stamps i.filled { background: var(--accent-color); }
    .stamp {
      width: 100%;
      margin-top: 12px;
      min-height: 56px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--accent-color);
      background: transparent;
      color: var(--accent-color);
      font: inherit;
      font-weight: var(--button-font-weight);
      cursor: pointer;
    }
    .stamp:focus-visible,
    .pin-keys button:focus-visible,
    .pin-cancel:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .pin-sheet {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: var(--overlay-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .pin-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }
    .pin-panel {
      width: min(420px, 100%);
      padding: 22px 18px 28px;
      border-radius: 24px 24px 0 0;
      border: 1px solid var(--border-color);
      background: var(--card-color);
      transform: translateY(110%);
      transition: transform 0.35s ease;
    }
    .pin-sheet.open .pin-panel { transform: none; }
    .pin-panel h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .pin-status {
      min-height: 2.6em;
      margin: 8px 0 14px;
      color: var(--muted-text-color);
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .pin-dots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--accent-color);
    }
    .pin-dots i.filled { background: var(--accent-color); }
    .pin-keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pin-keys button,
    .pin-cancel {
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--keypad-color);
      color: var(--text-color);
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pin-cancel {
      width: 100%;
      margin-top: 8px;
      color: var(--muted-text-color);
      font-size: 1rem;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 28px var(--button-shadow-color); }
      50% { transform: scale(1.035); box-shadow: 0 18px 40px var(--button-shadow-color); }
    }
    .showcase {
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }
    .showcase a {
      display: block;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      text-decoration: none;
      font-weight: 700;
    }
    .showcase a span {
      display: block;
      margin-top: 2px;
      color: var(--muted-text-color);
      font-weight: 500;
      font-size: 0.86rem;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--overlay-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .loader {
      width: min(280px, 86vw);
      text-align: center;
      transform: translateY(12px);
      transition: transform 0.35s ease;
    }
    .overlay.open .loader { transform: none; }
    .spinner {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid var(--button-shadow-color);
      border-top-color: var(--accent-color);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { margin: 0; color: var(--text-color); font-weight: 700; }
  </style>
</head>
<body>
  <main class="card" id="panel">
    <p class="eyebrow" id="eyebrow">JibAuto Systems</p>
    <h1 id="business-name">JibAuto Systems</h1>
    <p class="address" id="address" hidden></p>
    <p class="support" id="support-line">One NFC tap opens the Google review for the restaurant on the counter.</p>
    <section class="telemetry" id="telemetry" hidden>
      <p class="telemetry-label">Check-ins on this device</p>
      <p class="telemetry-count" id="checkin-count">0</p>
      <p class="stamp-label" id="stamp-label">Verified stamps</p>
      <div class="stamps" id="stamp-row" aria-hidden="true"></div>
    </section>
    <button type="button" class="review" id="review-button" hidden>⭐⭐⭐⭐⭐ Leave a Quick 5-Star Review</button>
    <button type="button" class="stamp" id="stamp-button" hidden>Tap to Verify Stamp</button>
    <ul class="showcase" id="showcase" aria-label="Client review pages"></ul>
  </main>
  <div class="pin-sheet" id="pin-sheet" hidden>
    <div class="pin-panel" role="dialog" aria-modal="true" aria-labelledby="pin-title">
      <h2 id="pin-title">Staff PIN</h2>
      <p class="pin-status" id="pin-status" aria-live="polite">Ask the cashier to enter the 4-digit code.</p>
      <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>
      <div class="pin-keys" id="pin-keys"></div>
      <button type="button" class="pin-cancel" id="pin-cancel">Cancel</button>
    </div>
  </div>
  <div class="overlay" id="loading-overlay" hidden>
    <div class="loader">
      <div class="spinner" aria-hidden="true"></div>
      <p>Opening your Google review</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
