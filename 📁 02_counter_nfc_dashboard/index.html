<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="description" content="JibAuto Systems opens a shop's Google review from one NFC tap.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="jibauto.net">
  <meta property="og:title" content="JibAuto Systems">
  <meta property="og:description" content="One NFC tap opens the Google review for the shop on the counter.">
  <meta property="og:url" content="https://jibauto.net">
  <link rel="canonical" href="https://jibauto.net">
  <title>JibAuto Systems</title>
  <style>
    :root {
      color-scheme: light;
      --background-color: #FDFBF7;
      --background-accent-color: #F6E8E4;
      --card-color: #FFFcf8;
      --border-color: #EAA9A9;
      --sage-color: #E4EBE0;
      --sage-ink-color: #6E7F68;
      --text-color: #3C332E;
      --muted-text-color: #7A6E68;
      --accent-color: #EAA9A9;
      --accent-ink-color: #3C332E;
      --button-gradient-start: #F6D2D2;
      --button-gradient-end: #EAA9A9;
      --button-shadow-color: #EAA9A966;
      --overlay-color: #3C332E99;
      --heading-font-weight: 600;
      --button-font-weight: 600;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 16px 40px;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      background:
        radial-gradient(720px 280px at 50% 0%, var(--background-accent-color) 0%, transparent 70%),
        var(--background-color);
      color: var(--text-color);
    }
    .bulletin {
      width: min(420px, 100%);
      margin: 0;
      padding: 18px 20px;
      border: 1px solid var(--border-color);
      border-radius: 72px 72px 22px 22px;
      background: var(--sage-color);
      color: var(--sage-ink-color);
      text-align: center;
      line-height: 1.45;
      font-size: 0.98rem;
    }
    .bulletin[hidden] { display: none; }
    .card {
      width: min(420px, 100%);
      padding: 36px 24px 28px;
      border: 1px solid var(--border-color);
      border-radius: 150px 150px 32px 32px;
      background: var(--card-color);
      box-shadow: 0 18px 40px #3C332E14;
      text-align: center;
    }
    .eyebrow {
      margin: 0;
      color: var(--sage-ink-color);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    h1 {
      margin: 14px 0 10px;
      font-weight: var(--heading-font-weight);
      font-size: clamp(1.8rem, 7vw, 2.3rem);
      line-height: 1.15;
    }
    .address,
    .support {
      margin: 0;
      color: var(--muted-text-color);
      line-height: 1.5;
    }
    .address { margin-bottom: 8px; }
    .support { margin-bottom: 26px; }
    .review {
      width: 100%;
      min-height: 72px;
      padding: 16px 18px;
      border: 0;
      border-radius: 999px;
      background-color: var(--accent-color);
      background-image: linear-gradient(180deg, var(--button-gradient-start) 0%, var(--button-gradient-end) 100%);
      color: var(--accent-ink-color);
      font: inherit;
      font-size: 1.05rem;
      font-weight: var(--button-font-weight);
      line-height: 1.3;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--button-shadow-color);
    }
    .review:hover {
      background-image: linear-gradient(180deg, var(--button-gradient-end) 0%, var(--button-gradient-start) 100%);
    }
    .review:focus-visible,
    .voucher-continue:focus-visible,
    .voucher-close:focus-visible,
    .showcase a:focus-visible {
      outline: 3px solid var(--sage-ink-color);
      outline-offset: 3px;
    }
    .review[hidden] { display: none; }
    .showcase {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }
    .showcase a {
      display: block;
      margin-top: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 28px 28px 12px 12px;
      background: var(--sage-color);
      color: var(--text-color);
      text-decoration: none;
      font-weight: 600;
    }
    .showcase a span {
      display: block;
      margin-top: 3px;
      color: var(--muted-text-color);
      font-weight: 500;
      font-size: 0.88rem;
    }
    .voucher-sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: var(--overlay-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .voucher-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }
    .voucher-panel {
      width: min(440px, 100%);
      margin: 0;
      padding: 28px 22px 32px;
      border: 1px solid var(--border-color);
      border-radius: 36px 36px 0 0;
      background: var(--card-color);
      color: var(--text-color);
      text-align: center;
      transform: translateY(110%);
      transition: transform 0.35s ease;
    }
    .voucher-sheet.open .voucher-panel { transform: none; }
    .voucher-copy {
      margin: 0 0 18px;
      font-size: 1.15rem;
      line-height: 1.45;
    }
    .voucher-continue,
    .voucher-close {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      font: inherit;
      font-weight: var(--button-font-weight);
      cursor: pointer;
    }
    .voucher-continue {
      border: 0;
      background: var(--accent-color);
      color: var(--accent-ink-color);
    }
    .voucher-close {
      margin-top: 8px;
      border: 1px solid var(--border-color);
      background: var(--sage-color);
      color: var(--sage-ink-color);
    }
  </style>
</head>
<body>
  <p class="bulletin" id="bulletin" hidden></p>
  <main class="card" id="panel">
    <p class="eyebrow" id="eyebrow">JibAuto Systems</p>
    <h1 id="business-name">JibAuto Systems</h1>
    <p class="address" id="address" hidden></p>
    <p class="support" id="support-line">One NFC tap opens the Google review for the shop on the counter.</p>
    <button type="button" class="review" id="review-button" hidden>Leave a Google review</button>
    <ul class="showcase" id="showcase" aria-label="Shop review pages"></ul>
  </main>
  <div class="voucher-sheet" id="voucher-sheet" hidden>
    <div class="voucher-panel" role="dialog" aria-modal="true" aria-labelledby="voucher-copy">
      <p class="voucher-copy" id="voucher-copy"></p>
      <button type="button" class="voucher-continue" id="voucher-continue">Continue to your Google review</button>
      <button type="button" class="voucher-close" id="voucher-close">Close</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
